<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FastReplyAI - زیادکردنی بەرھەم</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #1a1a1a; border-radius: 16px; padding: 32px; width: 100%; max-width: 500px; border: 1px solid #2a2a2a; }
  h1 { font-size: 22px; margin-bottom: 8px; color: #fff; }
  .sub { color: #888; font-size: 14px; margin-bottom: 28px; }
  label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; margin-top: 16px; }
  input { width: 100%; background: #111; border: 1px solid #333; border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 15px; outline: none; transition: border 0.2s; }
  input:focus { border-color: #6c63ff; }
  .hint { font-size: 12px; color: #555; margin-top: 4px; }
  button { width: 100%; margin-top: 28px; padding: 14px; background: #6c63ff; border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
  button:hover { background: #5a52d5; }
  button:disabled { background: #333; cursor: not-allowed; }
  .msg { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 14px; text-align: center; display: none; }
  .msg.success { background: #1a3a1a; border: 1px solid #2d5a2d; color: #6fcf6f; display: block; }
  .msg.error { background: #3a1a1a; border: 1px solid #5a2d2d; color: #cf6f6f; display: block; }
  .products-list { margin-top: 32px; border-top: 1px solid #2a2a2a; padding-top: 24px; }
  .products-list h2 { font-size: 16px; color: #aaa; margin-bottom: 16px; }
  .product-item { background: #111; border: 1px solid #2a2a2a; border-radius: 10px; padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; }
  .product-thumb { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: #222; flex-shrink: 0; }
  .product-thumb-placeholder { width: 52px; height: 52px; border-radius: 8px; background: #222; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .product-info { flex: 1; min-width: 0; }
  .product-name { font-size: 15px; font-weight: bold; }
  .product-meta { font-size: 12px; color: #666; margin-top: 4px; }
  .delete-btn { background: #3a1a1a; border: 1px solid #5a2d2d; color: #cf6f6f; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; flex-shrink: 0; }
  .delete-btn:hover { background: #5a2d2d; }
  #login-section { }
  #main-section { display: none; }

  /* Image upload area */
  .upload-area { width: 100%; min-height: 120px; background: #111; border: 2px dashed #333; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: border 0.2s; position: relative; overflow: hidden; margin-top: 6px; }
  .upload-area:hover { border-color: #6c63ff; }
  .upload-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-area .upload-icon { font-size: 32px; }
  .upload-area .upload-text { font-size: 13px; color: #666; margin-top: 6px; }
  .upload-area img { max-width: 100%; max-height: 200px; border-radius: 8px; display: none; }
  .upload-area.has-image .upload-icon,
  .upload-area.has-image .upload-text { display: none; }
  .upload-area.has-image img { display: block; }
</style>
</head>
<body>
<div class="card">

  <!-- LOGIN -->
  <div id="login-section">
    <h1>🔐 FastReplyAI</h1>
    <p class="sub">تکایە وشەی نهێنیت بنووسە</p>
    <label>وشەی نهێنی</label>
    <input type="password" id="password-input" placeholder="password" onkeydown="if(event.key==='Enter')login()" />
    <button onclick="login()">چوونەژوورەوە</button>
    <div id="login-msg" class="msg"></div>
  </div>

  <!-- MAIN -->
  <div id="main-section">
    <h1>➕ زیادکردنی بەرھەم</h1>
    <p class="sub">زانیاری بەرھەمەکە بنووسە</p>

    <label>ناوی بەرھەم</label>
    <input type="text" id="product_name" placeholder="مثال: هودی، تیشرت، 3aba..." />

    <label>لینکی پۆستی ئینستەگرام</label>
    <input type="text" id="post_link" placeholder="https://www.instagram.com/p/..." />
    <p class="hint">لینکەکە بنووسە، ID بە خۆکاری دەردەچێت</p>

    <label>نرخ (بە هەزار دینار)</label>
    <input type="number" id="price" placeholder="مثال: 35" />

    <label>قەبارەکان (Size)</label>
    <input type="text" id="sizes" placeholder="S, M, L, XL  یان  Freesize" />

    <label>رەنگەکان — ئەگەر هەیە</label>
    <input type="text" id="colors" placeholder="سوور، سەوز، مارۆنی  یان  sawz, swr, maroni" />

    <label>وێنەکانی بەرھەم — بۆ ناسینەوەی AI</label>
    <input type="file" id="image-input" accept="image/*" onchange="handleImages(event)" style="display:none" />
    <div id="image-previews" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center">
      <div onclick="document.getElementById('image-input').click()" style="width:70px;height:70px;border:2px dashed #444;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:28px;color:#555;flex-shrink:0">+</div>
    </div>
    <p class="hint">کلیک بکە بەسەر + بۆ زیادکردنی وێنە — دەتوانیت زۆر وێنە زیاد بکەیت</p>

    <button onclick="addProduct()" id="add-btn">زیادکردن ✅</button>
    <div id="add-msg" class="msg"></div>

    <div class="products-list">
      <h2>📦 بەرھەمە زیادکراوەکان</h2>
      <div id="products-container">چاوەڕێ بکە...</div>
    </div>
  </div>

</div>

<script>
let token = null;
let imagesData = []; // array of {base64, mimeType}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type;
}

function extractPostId(url) {
  const match = url.match(/instagram\.com\/(?:p|reel)\/([A-Za-z0-9_-]+)/);
  return match ? match[1] : null;
}

function handleImages(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    imagesData.push({ base64: e.target.result.split(',')[1], mimeType: file.type });
    const previews = document.getElementById('image-previews');
    // Insert new image before the + button
    const plusBtn = previews.querySelector('div');
    const wrapper = document.createElement('div');
    wrapper.style = 'position:relative;width:70px;height:70px;flex-shrink:0';
    const img = document.createElement('img');
    img.src = e.target.result;
    img.style = 'width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #333';
    const removeBtn = document.createElement('div');
    const idx = imagesData.length - 1;
    removeBtn.innerHTML = '✕';
    removeBtn.style = 'position:absolute;top:-6px;right:-6px;background:#3a1a1a;border:1px solid #5a2d2d;color:#cf6f6f;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer';
    removeBtn.onclick = () => { imagesData.splice(idx, 1); wrapper.remove(); };
    wrapper.appendChild(img);
    wrapper.appendChild(removeBtn);
    previews.insertBefore(wrapper, plusBtn);
  };
  reader.readAsDataURL(file);
  event.target.value = ''; // reset so same file can be picked again
}

async function login() {
  const pwd = document.getElementById('password-input').value;
  const res = await fetch('/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pwd })
  });
  const data = await res.json();
  if (data.success) {
    token = data.token;
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('main-section').style.display = 'block';
    loadProducts();
  } else {
    showMsg('login-msg', 'وشەی نهێنی هەڵەیە ❌', 'error');
  }
}

async function addProduct() {
  const name = document.getElementById('product_name').value.trim();
  const link = document.getElementById('post_link').value.trim();
  const price = document.getElementById('price').value.trim();
  const sizes = document.getElementById('sizes').value.trim();
  const colors = document.getElementById('colors').value.trim();

  if (!name || !link || !price) {
    showMsg('add-msg', 'تکایە ناو، لینک و نرخ پڕبکەرەوە', 'error');
    return;
  }

  const postId = extractPostId(link);
  if (!postId) {
    showMsg('add-msg', 'لینکی ئینستەگرام هەڵەیە', 'error');
    return;
  }

  document.getElementById('add-btn').disabled = true;
  showMsg('add-msg', 'چاوەڕێ بکە...', 'success');

  const res = await fetch('/admin/product', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': token },
    body: JSON.stringify({
      product_name: name,
      post_id: postId,
      post_link: link,
      price,
      sizes,
      colors,
      images: imagesData.length > 0 ? imagesData : null
    })
  });
  const data = await res.json();

  document.getElementById('add-btn').disabled = false;

  if (data.success) {
    showMsg('add-msg', 'بەرھەم زیادکرا ✅', 'success');
    document.getElementById('product_name').value = '';
    document.getElementById('post_link').value = '';
    document.getElementById('price').value = '';
    document.getElementById('sizes').value = '';
    document.getElementById('colors').value = '';
    imagesData = [];
    const previews = document.getElementById('image-previews');
    previews.innerHTML = '';
    previews.innerHTML = '<div onclick="document.getElementById(\'image-input\').click()" style="width:70px;height:70px;border:2px dashed #444;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:28px;color:#555;flex-shrink:0">+</div>';
    document.getElementById('image-input').value = '';
    loadProducts();
  } else {
    showMsg('add-msg', 'هەڵە: ' + (data.error || 'نەزانراو'), 'error');
  }
}

async function loadProducts() {
  const res = await fetch('/admin/products', { headers: { 'Authorization': token } });
  const data = await res.json();
  const container = document.getElementById('products-container');
  if (!data.products || data.products.length === 0) {
    container.innerHTML = '<p style="color:#555;font-size:13px">هیچ بەرھەمێک نەدۆزرایەوە</p>';
    return;
  }
  container.innerHTML = data.products.map(p => `
    <div class="product-item" id="product-${p.id}">
      ${p.image_url
        ? `<img class="product-thumb" src="${p.image_url}" alt="${p.product_name}" />`
        : `<div class="product-thumb-placeholder">📦</div>`}
      <div class="product-info">
        <div class="product-name">${p.product_name}</div>
        <div class="product-meta">${p.price} هەزار${p.sizes ? ' · ' + p.sizes : ''}${p.colors ? ' · ' + p.colors : ''}</div>
        <div class="product-meta" style="color:#444">${p.post_id}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
        <button class="delete-btn" style="background:#1a2a3a;border-color:#2d4a5a;color:#6fb3cf" onclick="editProduct('${p.id}','${p.product_name}','${p.price}','${(p.sizes||'').replace(/'/g,"\\'")}','${(p.colors||'').replace(/'/g,"\\'")}','${p.post_id||''}','${p.image_url||''}')">دەستکاری</button>
        <button class="delete-btn" onclick="deleteProduct('${p.id}')">سڕینەوە</button>
      </div>
    </div>
  `).join('');
}

async function deleteProduct(id) {
  if (!confirm('دڵنیایت لە سڕینەوەی ئەم بەرھەمە؟')) return;
  await fetch('/admin/product/' + id, { method: 'DELETE', headers: { 'Authorization': token } });
  loadProducts();
}

let editImageBase64 = {};
let editImageMime = {};

function editProduct(id, name, price, sizes, colors, postId, imageUrl) {
  const el = document.getElementById('product-' + id);
  el.innerHTML = `
    <div style="width:100%">
      <div style="font-size:13px;color:#aaa;margin-bottom:10px">دەستکاریکردن ✏️</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <input id="edit-name-${id}" value="${name}" placeholder="ناوی بەرھەم" style="background:#1a1a1a;border:1px solid #444;border-radius:8px;padding:8px 12px;color:#fff;font-size:14px;width:100%" />
        <input id="edit-price-${id}" value="${price}" placeholder="نرخ" type="number" style="background:#1a1a1a;border:1px solid #444;border-radius:8px;padding:8px 12px;color:#fff;font-size:14px;width:100%" />
        <input id="edit-sizes-${id}" value="${sizes}" placeholder="قەبارەکان" style="background:#1a1a1a;border:1px solid #444;border-radius:8px;padding:8px 12px;color:#fff;font-size:14px;width:100%" />
        <input id="edit-colors-${id}" value="${colors}" placeholder="رەنگەکان" style="background:#1a1a1a;border:1px solid #444;border-radius:8px;padding:8px 12px;color:#fff;font-size:14px;width:100%" />
        <input id="edit-link-${id}" value="${postId ? 'https://www.instagram.com/p/' + postId + '/' : ''}" placeholder="لینکی ئینستەگرام (ئەگەر دەتەوێت بگۆڕیت)" style="background:#1a1a1a;border:1px solid #444;border-radius:8px;padding:8px 12px;color:#fff;font-size:14px;width:100%;direction:ltr" />
        <div style="font-size:12px;color:#555;margin-top:-4px">وێنەکان — کلیک بکە بەسەر + بۆ زیادکردنی وێنەی نوێ</div>
        <input type="file" id="edit-img-input-${id}" accept="image/*" style="display:none" onchange="handleEditImage(event,'${id}')" />
        <div id="edit-previews-${id}" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center">
          ${imageUrl ? `<div style="position:relative;width:70px;height:70px;flex-shrink:0"><img src="${imageUrl}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #333" /></div>` : ''}
          <div onclick="document.getElementById('edit-img-input-${id}').click()" style="width:70px;height:70px;border:2px dashed #444;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:28px;color:#555;flex-shrink:0">+</div>
        </div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button onclick="saveProduct('${id}')" style="flex:1;padding:8px;background:#6c63ff;border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:14px">پاشەکەوتکردن ✅</button>
          <button onclick="loadProducts()" style="flex:1;padding:8px;background:#222;border:1px solid #444;border-radius:8px;color:#aaa;cursor:pointer;font-size:14px">هەڵوەشاندنەوە</button>
        </div>
      </div>
    </div>
  `;
}

function handleEditImage(event, id) {
  const file = event.target.files[0];
  if (!file) return;
  if (!editImageBase64[id]) editImageBase64[id] = [];
  if (!editImageMime[id]) editImageMime[id] = [];
  const reader = new FileReader();
  reader.onload = (e) => {
    editImageBase64[id].push(e.target.result.split(',')[1]);
    editImageMime[id].push(file.type);
    const previews = document.getElementById('edit-previews-' + id);
    const plusBtn = previews.querySelector('div:last-child');
    const wrapper = document.createElement('div');
    wrapper.style = 'position:relative;width:70px;height:70px;flex-shrink:0';
    const img = document.createElement('img');
    img.src = e.target.result;
    img.style = 'width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #333';
    const removeBtn = document.createElement('div');
    const idx = editImageBase64[id].length - 1;
    removeBtn.innerHTML = '✕';
    removeBtn.style = 'position:absolute;top:-6px;right:-6px;background:#3a1a1a;border:1px solid #5a2d2d;color:#cf6f6f;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer';
    removeBtn.onclick = () => { editImageBase64[id].splice(idx, 1); editImageMime[id].splice(idx, 1); wrapper.remove(); };
    wrapper.appendChild(img);
    wrapper.appendChild(removeBtn);
    previews.insertBefore(wrapper, plusBtn);
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

async function saveProduct(id) {
  const name = document.getElementById('edit-name-' + id).value.trim();
  const price = document.getElementById('edit-price-' + id).value.trim();
  const sizes = document.getElementById('edit-sizes-' + id).value.trim();
  const colors = document.getElementById('edit-colors-' + id).value.trim();
  const link = document.getElementById('edit-link-' + id).value.trim();
  const postId = link ? extractPostId(link) : null;

  const images = editImageBase64[id] && editImageBase64[id].length > 0
    ? editImageBase64[id].map((b, i) => ({ base64: b, mimeType: editImageMime[id][i] }))
    : null;

  const res = await fetch('/admin/product/' + id, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': token },
    body: JSON.stringify({
      product_name: name,
      price,
      sizes,
      colors,
      post_id: postId || undefined,
      images: images
    })
  });
  const data = await res.json();
  if (data.success) {
    delete editImageBase64[id];
    delete editImageMime[id];
    loadProducts();
  } else {
    alert('هەڵە: ' + (data.error || 'نەزانراو'));
  }
}
</script>
</body>
</html>
